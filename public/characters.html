<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07192b" />
  <title>Cricket Captain 3D — Character Gallery</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07192b;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{background:radial-gradient(circle at 50% 24%,#194d75 0,#0c2944 35%,#07192b 72%)}
    .top{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;z-index:4;pointer-events:none}.title,.back{background:rgba(5,20,35,.82);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:16px}.title{padding:10px 14px}.title b{display:block;font-size:15px}.title small{color:#9ec5df}.back{pointer-events:auto;text-decoration:none;color:#fff;padding:11px 15px;font-weight:800}
    .stage{position:absolute;inset:0;display:grid;place-items:center;padding:92px 18px 160px}.spotlight{position:absolute;width:min(78vw,650px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#67d8ff55 0,#3b8ad622 45%,transparent 70%);filter:blur(4px)}.platform{position:absolute;bottom:125px;width:min(68vw,560px);height:90px;border-radius:50%;background:linear-gradient(180deg,#53c7ff,#1778be);box-shadow:0 25px 50px #0008,inset 0 8px 16px #b9efff55;transform:perspective(500px) rotateX(63deg)}
    .character-wrap{position:relative;height:min(72vh,810px);width:min(72vw,590px);display:flex;align-items:flex-end;justify-content:center;z-index:2;filter:drop-shadow(0 24px 22px #0007);transition:transform .28s ease}.character{width:100%;height:100%;object-fit:contain;object-position:center bottom;user-select:none;-webkit-user-drag:none;transition:opacity .16s ease,transform .28s ease}.character-wrap.mirror{transform:scaleX(-1)}
    .controls{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;width:min(760px,calc(100% - 24px));background:rgba(5,20,35,.9);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:12px;backdrop-filter:blur(14px);box-shadow:0 18px 50px #0006}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.roles button,.actions button{border:0;border-radius:12px;padding:10px 8px;font-weight:800;background:#173550;color:#dcecff}.roles button.active{background:linear-gradient(135deg,#58d4ff,#7b75ff);color:#06101d}.actions{display:flex;justify-content:center;gap:10px;margin-top:10px}.actions button{min-width:120px}.hint{text-align:center;color:#9ec5df;font-size:12px;margin-top:8px}
    .badge{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:3;padding:7px 12px;border-radius:999px;background:#ffd74a;color:#07192b;font-weight:900;font-size:12px;letter-spacing:.08em;box-shadow:0 10px 28px #0005}
    @keyframes celebrate{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-28px) rotate(-2deg)}65%{transform:translateY(-12px) rotate(2deg)}}.celebrate{animation:celebrate .9s ease}
    @media(max-width:700px){.stage{padding:100px 6px 150px}.character-wrap{height:69vh;width:92vw}.platform{bottom:128px;width:78vw}.roles button{font-size:12px;padding:9px 4px}.title small{display:none}.controls{padding:9px}.actions button{min-width:96px;padding:9px}.hint{margin-top:5px}}
  </style>
</head>
<body>
  <div class="top"><a class="back" href="./">← Game</a><div class="title"><b id="characterName">Captain Ace</b><small id="characterDetail">Batter · Balanced</small></div></div>
  <div class="badge">ORIGINAL ILLUSTRATED CHARACTERS</div>
  <main class="stage">
    <div class="spotlight"></div><div class="platform"></div>
    <div class="character-wrap" id="characterWrap"><img id="character" class="character" src="./assets/characters/batter-idle.svg" alt="Captain Ace cartoon cricket character" /></div>
  </main>
  <div class="controls">
    <div class="roles"><button data-role="batter" class="active">Batter</button><button data-role="bowler">Bowler</button><button data-role="keeper">Keeper</button><button data-role="fielder">Fielder</button></div>
    <div class="actions"><button id="mirror">Mirror View</button><button id="pose">Animate Pose</button></div>
    <div class="hint">These illustrated characters are used directly inside the match.</div>
  </div>
<script>
const character=document.getElementById('character');const wrap=document.getElementById('characterWrap');let role='batter',activePose=false;
const data={
 batter:{name:'Captain Ace',detail:'Batter · Balanced',idle:'batter-idle.svg',action:'batter-shot.svg'},
 bowler:{name:'Blaze',detail:'Fast Bowler · Express pace',idle:'bowler-idle.svg',action:'bowler-delivery.svg'},
 keeper:{name:'Guardian',detail:'Wicketkeeper · Agile',idle:'keeper.svg',action:'keeper.svg'},
 fielder:{name:'Striker',detail:'Fielder · Athletic',idle:'fielder.svg',action:'fielder.svg'}
};
function setImage(file){character.style.opacity='0';setTimeout(()=>{character.src='./assets/characters/'+file;character.style.opacity='1'},120)}
function setRole(next){role=next;activePose=false;const item=data[role];setImage(item.idle);document.getElementById('characterName').textContent=item.name;document.getElementById('characterDetail').textContent=item.detail;document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));wrap.classList.remove('celebrate');void wrap.offsetWidth}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>setRole(b.dataset.role));document.getElementById('mirror').onclick=()=>wrap.classList.toggle('mirror');document.getElementById('pose').onclick=()=>{const item=data[role];activePose=!activePose;setImage(activePose?item.action:item.idle);wrap.classList.remove('celebrate');void wrap.offsetWidth;wrap.classList.add('celebrate')};
</script>
</body>
</html>
