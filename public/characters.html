<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07192b" />
  <title>Cricket Captain 3D — Character Viewer</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07192b;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;z-index:4;pointer-events:none}.title{background:rgba(5,20,35,.82);backdrop-filter:blur(12px);padding:10px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.15)}.title b{display:block;font-size:15px}.title small{color:#9ec5df}.back{pointer-events:auto;text-decoration:none;color:#fff;background:rgba(5,20,35,.86);border:1px solid rgba(255,255,255,.18);padding:11px 15px;border-radius:14px;font-weight:800}.controls{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;width:min(760px,calc(100% - 24px));background:rgba(5,20,35,.88);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:12px;backdrop-filter:blur(14px)}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.roles button,.rotate button{border:0;border-radius:12px;padding:10px 8px;font-weight:800;background:#173550;color:#dcecff}.roles button.active{background:linear-gradient(135deg,#58d4ff,#7b75ff);color:#06101d}.rotate{display:flex;justify-content:center;gap:10px;margin-top:10px}.rotate button{min-width:110px}.hint{text-align:center;color:#9ec5df;font-size:12px;margin-top:8px}@media(max-width:700px){.roles button{font-size:12px;padding:9px 4px}.title small{display:none}.controls{padding:9px}.rotate button{min-width:90px;padding:8px}.hint{margin-top:5px}}
  </style>
</head>
<body>
  <canvas id="viewer"></canvas>
  <div class="top"><a class="back" href="./">← Game</a><div class="title"><b id="characterName">Captain Ace</b><small id="characterDetail">Batter · Balanced</small></div></div>
  <div class="controls">
    <div class="roles">
      <button data-role="batter" class="active">Batter</button><button data-role="bowler">Bowler</button><button data-role="keeper">Keeper</button><button data-role="fielder">Fielder</button>
    </div>
    <div class="rotate"><button id="left">↶ Rotate</button><button id="pose">Animate</button><button id="right">Rotate ↷</button></div>
    <div class="hint">Drag anywhere to rotate the character. Pinch to zoom.</div>
  </div>
<script type="module">
import * as BABYLON from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@7.54.3/+esm';
const canvas=document.getElementById('viewer');
const engine=new BABYLON.Engine(canvas,true,{antialias:true},true);
const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.05,.13,.22,1);
const camera=new BABYLON.ArcRotateCamera('cam',Math.PI/2,1.15,13,new BABYLON.Vector3(0,3.4,0),scene);camera.attachControl(canvas,true);camera.lowerRadiusLimit=8;camera.upperRadiusLimit=18;camera.lowerBetaLimit=.65;camera.upperBetaLimit=1.5;
const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=1.5;const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.4,-1,-.5),scene);key.position=new BABYLON.Vector3(8,12,8);key.intensity=2.4;
const ground=BABYLON.MeshBuilder.CreateDisc('ground',{radius:5,tessellation:64},scene);ground.rotation.x=Math.PI/2;ground.material=mat('ground','#13334c');
function mat(name,c){const m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(c);m.specularColor=new BABYLON.Color3(.2,.2,.2);return m}
function part(name,parent,kind,size,pos,color){let m;if(kind==='box')m=BABYLON.MeshBuilder.CreateBox(name,{width:size.x,height:size.y,depth:size.z},scene);else if(kind==='sphere')m=BABYLON.MeshBuilder.CreateSphere(name,{diameter:1,segments:16},scene);else if(kind==='capsule')m=BABYLON.MeshBuilder.CreateCapsule(name,{height:size.y,radius:size.x},scene);else m=BABYLON.MeshBuilder.CreateCylinder(name,{height:size.y,diameterTop:size.x,diameterBottom:size.z||size.x,tessellation:14},scene);m.parent=parent;m.position.copyFrom(pos);if(kind==='sphere')m.scaling.copyFrom(size);m.material=mat(name+'-m',color);return m}
let current,role='batter',animating=false;
function createCharacter(role){if(current)current.dispose(false,true);const root=new BABYLON.TransformNode('character',scene);const jersey=role==='batter'?'#18a9e6':role==='keeper'?'#f4c430':'#ef5a3d';const skin=role==='bowler'?'#9b5b39':'#d59a6f';const shorts=role==='batter'?'#f4f7fb':'#263a55';
part('torso',root,'capsule',new BABYLON.Vector3(.95,3.3,0),new BABYLON.Vector3(0,3.55,0),jersey).scaling.x=1.08;part('stripe',root,'box',new BABYLON.Vector3(1.95,.38,.6),new BABYLON.Vector3(0,3.7,-.55),'#fff');part('waist',root,'cylinder',new BABYLON.Vector3(1.65,.7,1.45),new BABYLON.Vector3(0,1.85,0),shorts);
const head=new BABYLON.TransformNode('head',scene);head.parent=root;head.position.set(0,6.3,0);part('face',head,'sphere',new BABYLON.Vector3(1.25,1.35,1.15),BABYLON.Vector3.Zero(),skin);part('nose',head,'sphere',new BABYLON.Vector3(.16,.2,.18),new BABYLON.Vector3(0,-.05,-1.1),skin);part('mouth',head,'box',new BABYLON.Vector3(.48,.08,.08),new BABYLON.Vector3(0,-.42,-1.08),'#6f2c2c');[-.42,.42].forEach(x=>{part('white'+x,head,'sphere',new BABYLON.Vector3(.25,.2,.1),new BABYLON.Vector3(x,.2,-1.05),'#fff');part('eye'+x,head,'sphere',new BABYLON.Vector3(.105,.105,.07),new BABYLON.Vector3(x,.19,-1.14),'#111')});
if(role==='batter'||role==='keeper'){part('helmet',head,'sphere',new BABYLON.Vector3(1.34,.74,1.24),new BABYLON.Vector3(0,.65,0),role==='batter'?'#173b75':'#d69f12');part('peak',head,'box',new BABYLON.Vector3(1.45,.16,.8),new BABYLON.Vector3(0,.42,-1.02),role==='batter'?'#173b75':'#d69f12');[-.72,0,.72].forEach(x=>part('grill'+x,head,'cylinder',new BABYLON.Vector3(.06,1.05,.06),new BABYLON.Vector3(x,-.18,-1.28),'#d7dde2'))}else{part('hair',head,'sphere',new BABYLON.Vector3(1.28,.55,1.2),new BABYLON.Vector3(0,.72,.08),'#241914');part('cap',head,'box',new BABYLON.Vector3(1.3,.16,.7),new BABYLON.Vector3(0,.45,-1),'#243a66')}
const arms=[];[-1,1].forEach((s,i)=>{const a=new BABYLON.TransformNode(i?'rightArm':'leftArm',scene);a.parent=root;a.position.set(s*1.18,4.45,0);part('arm'+i,a,'capsule',new BABYLON.Vector3(.34,2,0),new BABYLON.Vector3(0,-.75,0),jersey);part('hand'+i,a,'sphere',new BABYLON.Vector3(.43,.46,.4),new BABYLON.Vector3(0,-1.75,0),(role==='batter'||role==='keeper')?'#f2f4f7':skin);arms.push(a)});
const legs=[];[-1,1].forEach((s,i)=>{const l=new BABYLON.TransformNode(i?'rightLeg':'leftLeg',scene);l.parent=root;l.position.set(s*.55,1.7,0);part('leg'+i,l,'capsule',new BABYLON.Vector3(.43,2.4,0),new BABYLON.Vector3(0,-.9,0),shorts);part('shoe'+i,l,'box',new BABYLON.Vector3(.8,.43,1.25),new BABYLON.Vector3(0,-2.05,-.23),'#17202b');if(role==='batter'||role==='keeper')part('pad'+i,l,'box',new BABYLON.Vector3(.72,1.72,.38),new BABYLON.Vector3(0,-.78,-.48),'#f5f2df');legs.push(l)});
if(role==='batter'){arms[0].rotation.set(-.55,0,.18);arms[1].rotation.set(-.72,0,-.15);const bat=part('bat',arms[1],'box',new BABYLON.Vector3(.52,4.25,.25),new BABYLON.Vector3(0,-1.7,-.2),'#e8b96e');bat.rotation.z=-.2}if(role==='keeper'){arms[0].rotation.set(-.55,0,-.4);arms[1].rotation.set(-.55,0,.4);legs[0].rotation.z=-.13;legs[1].rotation.z=.13}if(role==='bowler'){arms[1].rotation.x=-.6;arms[0].rotation.x=.3}current=root;current.metadata={arms,legs,head};return root}
function setRole(r){role=r;createCharacter(r);document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===r));const labels={batter:['Captain Ace','Batter · Balanced'],bowler:['Blaze','Fast Bowler · Express pace'],keeper:['Guardian','Wicketkeeper · Agile'],fielder:['Striker','Fielder · Athletic']};document.getElementById('characterName').textContent=labels[r][0];document.getElementById('characterDetail').textContent=labels[r][1]}
function animate(){if(animating)return;animating=true;const start=performance.now(),arms=current.metadata.arms,legs=current.metadata.legs;function tick(){const p=Math.min(1,(performance.now()-start)/900),s=Math.sin(p*Math.PI);if(role==='batter'){arms[1].rotation.z=-.15+s*1.8;arms[0].rotation.z=.18+s*.9;current.rotation.y=-s*.55}else if(role==='bowler'){arms[1].rotation.x=-.6-s*2;arms[0].rotation.x=.3+s;legs[0].rotation.x=-s*.5;legs[1].rotation.x=s*.5}else if(role==='keeper'){current.position.y=-s*.25;arms[0].rotation.x=-.55-s*.55;arms[1].rotation.x=-.55-s*.55}else{arms[0].rotation.x=s*.8;arms[1].rotation.x=-s*.8;legs[0].rotation.x=-s*.55;legs[1].rotation.x=s*.55}if(p<1)requestAnimationFrame(tick);else{animating=false;setRole(role)}}requestAnimationFrame(tick)}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>setRole(b.dataset.role));document.getElementById('left').onclick=()=>current.rotation.y-=Math.PI/6;document.getElementById('right').onclick=()=>current.rotation.y+=Math.PI/6;document.getElementById('pose').onclick=animate;setRole('batter');engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
</script>
</body>
</html>
