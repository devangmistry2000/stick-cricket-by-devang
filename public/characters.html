<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#07192b" />
<title>Cricket Captain 3D — Character Viewer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07192b;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;z-index:4;pointer-events:none}.title,.back{background:rgba(5,20,35,.86);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);border-radius:15px}.title{padding:10px 14px}.title b{display:block;font-size:15px}.title small{color:#9ec5df}.back{pointer-events:auto;text-decoration:none;color:#fff;padding:11px 15px;font-weight:800}.controls{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;width:min(760px,calc(100% - 24px));background:rgba(5,20,35,.9);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:12px;backdrop-filter:blur(14px)}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.roles button,.actions button{border:0;border-radius:12px;padding:10px 8px;font-weight:800;background:#173550;color:#dcecff}.roles button.active{background:linear-gradient(135deg,#58d4ff,#7b75ff);color:#06101d}.actions{display:flex;justify-content:center;gap:10px;margin-top:10px}.actions button{min-width:110px}.hint{text-align:center;color:#9ec5df;font-size:12px;margin-top:8px}@media(max-width:700px){.roles button{font-size:12px;padding:9px 4px}.title small{display:none}.controls{padding:9px}.actions button{min-width:90px;padding:8px}.hint{margin-top:5px}}
</style>
</head>
<body>
<canvas id="viewer"></canvas>
<div class="top"><a class="back" href="./">← Game</a><div class="title"><b id="name">Captain Ace</b><small id="detail">Batter · Full 3D cartoon rig</small></div></div>
<div class="controls"><div class="roles"><button data-role="batter" class="active">Batter</button><button data-role="bowler">Bowler</button><button data-role="keeper">Keeper</button><button data-role="fielder">Fielder</button></div><div class="actions"><button id="left">↶ Rotate</button><button id="pose">Animate</button><button id="right">Rotate ↷</button></div><div class="hint">Drag to rotate. Pinch to zoom. All characters are real 3D geometry.</div></div>
<script type="module">
import * as B from 'https://cdn.jsdelivr.net/npm/@babylonjs/core@7.54.3/+esm';
const canvas=document.getElementById('viewer'),engine=new B.Engine(canvas,true,{antialias:true},true),scene=new B.Scene(engine);scene.clearColor=new B.Color4(.035,.1,.17,1);
const camera=new B.ArcRotateCamera('camera',Math.PI/2,1.15,12,new B.Vector3(0,3.25,0),scene);camera.attachControl(canvas,true);camera.lowerRadiusLimit=8;camera.upperRadiusLimit=17;camera.lowerBetaLimit=.65;camera.upperBetaLimit=1.48;
const hemi=new B.HemisphericLight('hemi',new B.Vector3(0,1,0),scene);hemi.intensity=1.3;const key=new B.DirectionalLight('key',new B.Vector3(-.45,-1,-.55),scene);key.position=new B.Vector3(8,13,8);key.intensity=2.1;
const ground=B.MeshBuilder.CreateDisc('ground',{radius:4.3,tessellation:64},scene);ground.rotation.x=Math.PI/2;ground.material=mat('ground','#123852');
function mat(n,c){const m=new B.StandardMaterial(n,scene);m.diffuseColor=B.Color3.FromHexString(c);m.specularColor=new B.Color3(.14,.14,.14);return m}
function part(n,p,k,s,pos,m){let x;if(k==='box')x=B.MeshBuilder.CreateBox(n,{width:s.x,height:s.y,depth:s.z},scene);else if(k==='sphere'){x=B.MeshBuilder.CreateSphere(n,{diameter:1,segments:16},scene);x.scaling.copyFrom(s)}else if(k==='capsule')x=B.MeshBuilder.CreateCapsule(n,{height:s.y,radius:s.x,tessellation:16},scene);else x=B.MeshBuilder.CreateCylinder(n,{height:s.y,diameterTop:s.x,diameterBottom:s.z||s.x,tessellation:16},scene);x.parent=p;x.position.copyFrom(pos);x.material=m;return x}
let current,role='batter',busy=false;
function create(role){if(current)current.root.dispose(false,true);const root=new B.TransformNode('character',scene),body=new B.TransformNode('body',scene);body.parent=root;const jersey=mat('jersey'+role,role==='batter'?'#18a9e6':role==='keeper'?'#ffc93c':'#f05a3b'),secondary=mat('secondary'+role,role==='batter'||role==='keeper'?'#f3f6fb':'#20324f'),accent=mat('accent'+role,role==='batter'?'#ffd74a':'#17335f'),skin=mat('skin'+role,role==='bowler'?'#9a5a38':'#d59a6f'),dark=mat('dark'+role,'#172033'),white=mat('white'+role,'#fff'),helmet=mat('helmet'+role,role==='keeper'?'#d9a31d':'#244581'),grill=mat('grill'+role,'#d7dde2'),pad=mat('pad'+role,'#f4f1df');
part('hips',body,'box',new B.Vector3(1.55,.72,1.25),new B.Vector3(0,1.8,0),secondary);const torso=part('torso',body,'capsule',new B.Vector3(.88,2.75,0),new B.Vector3(0,3.62,0),jersey);torso.scaling.x=1.08;part('belly',body,'sphere',new B.Vector3(1.56,1.34,1.25),new B.Vector3(0,3.2,.06),jersey);const stripe=part('stripe',body,'box',new B.Vector3(1.8,.24,1.2),new B.Vector3(0,3.55,-.78),accent);stripe.rotation.x=.08;
const neck=new B.TransformNode('neck',scene);neck.parent=body;neck.position.set(0,5.08,.02);part('neckMesh',neck,'cylinder',new B.Vector3(.3,.46,.3),new B.Vector3(0,.18,0),skin);const head=new B.TransformNode('head',scene);head.parent=neck;head.position.set(0,.7,.02);const face=part('face',head,'sphere',new B.Vector3(1.14,1.28,1.08),B.Vector3.Zero(),skin);face.scaling.y=1.1;part('jaw',head,'sphere',new B.Vector3(.98,.78,.98),new B.Vector3(0,-.56,.1),skin);for(const x of[-.34,.34]){part('ew'+x,head,'sphere',new B.Vector3(.34,.2,.14),new B.Vector3(x,.2,-.96),white);part('eye'+x,head,'sphere',new B.Vector3(.11,.11,.11),new B.Vector3(x,.19,-1.06),dark)}part('nose',head,'sphere',new B.Vector3(.18,.2,.2),new B.Vector3(0,-.03,-1.04),skin);part('mouth',head,'box',new B.Vector3(.52,.07,.08),new B.Vector3(0,-.52,-1.01),mat('mouth'+role,'#7f342e'));
if(role==='batter'||role==='keeper'){const top=part('helmetTop',head,'sphere',new B.Vector3(1.25,.84,1.2),new B.Vector3(0,.82,.02),helmet);top.scaling.y=.72;part('helmetSide',head,'box',new B.Vector3(1.95,.76,1.58),new B.Vector3(0,.36,.14),helmet);const peak=part('peak',head,'box',new B.Vector3(1.28,.16,.7),new B.Vector3(0,.28,-1.03),helmet);peak.rotation.x=.14;for(const x of[-.54,0,.54])part('grill'+x,head,'cylinder',new B.Vector3(.05,1.28,.05),new B.Vector3(x,-.14,-1.23),grill);part('bar',head,'box',new B.Vector3(1.14,.08,.08),new B.Vector3(0,.34,-1.2),grill)}else{const cap=part('cap',head,'sphere',new B.Vector3(1.18,.64,1.14),new B.Vector3(0,.7,.06),helmet);cap.scaling.y=.6;const peak=part('capPeak',head,'box',new B.Vector3(1.1,.15,.66),new B.Vector3(0,.42,-1.02),helmet);peak.rotation.x=.12}
const ls=new B.TransformNode('ls',scene),rs=new B.TransformNode('rs',scene),le=new B.TransformNode('le',scene),re=new B.TransformNode('re',scene);ls.parent=rs.parent=body;ls.position.set(-1.02,4.5,.05);rs.position.set(1.02,4.5,.05);le.parent=ls;re.parent=rs;for(const[s,sh,el]of[['l',ls,le],['r',rs,re]]){part(s+'upper',sh,'capsule',new B.Vector3(.28,1.66,0),new B.Vector3(0,-.7,0),jersey);el.position.set(0,-1.42,0);part(s+'lower',el,'capsule',new B.Vector3(.24,1.48,0),new B.Vector3(0,-.62,0),role==='batter'||role==='keeper'?white:skin);part(s+'hand',el,'sphere',new B.Vector3(.34,.34,.34),new B.Vector3(0,-1.4,0),role==='batter'||role==='keeper'?white:skin)}
const lh=new B.TransformNode('lh',scene),rh=new B.TransformNode('rh',scene),lk=new B.TransformNode('lk',scene),rk=new B.TransformNode('rk',scene);lh.parent=rh.parent=body;lh.position.set(-.48,1.52,0);rh.position.set(.48,1.52,0);lk.parent=lh;rk.parent=rh;for(const[s,h,k]of[['l',lh,lk],['r',rh,rk]]){part(s+'thigh',h,'capsule',new B.Vector3(.34,1.86,0),new B.Vector3(0,-.78,0),secondary);k.position.set(0,-1.58,0);part(s+'shin',k,'capsule',new B.Vector3(.29,1.62,0),new B.Vector3(0,-.68,0),role==='batter'||role==='keeper'?pad:secondary);const shoe=part(s+'shoe',k,'box',new B.Vector3(.7,.3,1.08),new B.Vector3(0,-1.42,-.18),dark);shoe.rotation.x=-.08}
let batPivot;if(role==='batter'){batPivot=new B.TransformNode('batPivot',scene);batPivot.parent=re;batPivot.position.set(-.02,-1.26,-.02);const bat=B.MeshBuilder.CreateBox('bat',{width:.46,height:4.2,depth:.22},scene);bat.parent=batPivot;bat.position.set(-.2,-1.4,-.18);bat.rotation.set(.06,0,-.42);bat.material=mat('batMat','#e8b96e')}
current={root,body,head,ls,le,rs,re,lh,lk,rh,rk,batPivot};pose();return current}
function pose(){const r=current;r.body.position.set(0,0,0);r.body.rotation.set(0,0,0);r.head.rotation.set(0,0,0);r.ls.rotation.set(0,0,0);r.le.rotation.set(0,0,0);r.rs.rotation.set(0,0,0);r.re.rotation.set(0,0,0);r.lh.rotation.set(0,0,0);r.lk.rotation.set(0,0,0);r.rh.rotation.set(0,0,0);r.rk.rotation.set(0,0,0);if(role==='batter'){r.ls.rotation.set(-.18,.16,.62);r.le.rotation.set(-.14,0,.52);r.rs.rotation.set(-.72,-.1,-.2);r.re.rotation.set(-.2,0,-.44);r.lh.rotation.z=-.09;r.rh.rotation.z=.09;r.batPivot?.rotation.set(.14,-.2,-.72)}else if(role==='keeper'){r.ls.rotation.set(-.86,0,.4);r.rs.rotation.set(-.86,0,-.4);r.le.rotation.set(-.22,0,.3);r.re.rotation.set(-.22,0,-.3);r.lh.rotation.set(.24,0,-.16);r.rh.rotation.set(.24,0,.16);r.lk.rotation.x=-.34;r.rk.rotation.x=-.34;r.body.position.y=-.36}else if(role==='fielder'){r.ls.rotation.z=.12;r.rs.rotation.z=-.12}else{r.ls.rotation.x=.12;r.rs.rotation.x=-.12}}
function setRole(v){role=v;create(v);document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===v));const d={batter:['Captain Ace','Batter · Full 3D cartoon rig'],bowler:['Blaze','Fast bowler · Articulated run-up'],keeper:['Guardian','Wicketkeeper · Crouch pose'],fielder:['Striker','Fielder · Athletic 3D build']}[v];document.getElementById('name').textContent=d[0];document.getElementById('detail').textContent=d[1]}
function animate(){if(busy)return;busy=true;const start=performance.now(),tick=()=>{const p=Math.min(1,(performance.now()-start)/900),s=Math.sin(p*Math.PI),r=current;if(role==='batter'){r.rs.rotation.x=-.72-1.2*s;r.rs.rotation.z=-.2-.55*s;r.re.rotation.z=-.44-.42*s;r.ls.rotation.x=-.18-.8*s;r.ls.rotation.z=.62+.42*s;r.batPivot.rotation.z=-.72-1.05*s;r.root.rotation.y=-.38*s}else if(role==='bowler'){r.rs.rotation.x=-.12-2*s;r.ls.rotation.x=.12+.8*s;r.lh.rotation.x=-.7*s;r.rh.rotation.x=.7*s;r.body.position.y=Math.abs(Math.sin(p*Math.PI*4))*.08}else if(role==='keeper'){r.body.position.y=-.36-.22*s;r.ls.rotation.x=-.86-.5*s;r.rs.rotation.x=-.86-.5*s}else{r.ls.rotation.x=.8*s;r.rs.rotation.x=-.8*s;r.lh.rotation.x=-.55*s;r.rh.rotation.x=.55*s}if(p<1)requestAnimationFrame(tick);else{busy=false;r.root.rotation.set(0,0,0);pose()}};requestAnimationFrame(tick)}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>setRole(b.dataset.role));document.getElementById('left').onclick=()=>current.root.rotation.y-=Math.PI/6;document.getElementById('right').onclick=()=>current.root.rotation.y+=Math.PI/6;document.getElementById('pose').onclick=animate;setRole('batter');engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
</script>
</body>
</html>
